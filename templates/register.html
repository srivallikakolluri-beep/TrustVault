{% extends "base.html" %}{% block content %}<section class="panel narrow"><h1>Create account</h1><form method="post">
<input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Username</label><input name="username" minlength="3" required>
<label>Password (10+ characters)</label><input name="password" type="password" minlength="10" required>
<label>Role</label><select name="role"><option value="viewer">Viewer</option><option value="owner">Document owner</option></select>
<button class="primary">Register</button></form></section>{% endblock %}
