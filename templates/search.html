{% extends "base.html" %}{% block content %}<section class="panel"><h1>Search results</h1><form method="get" class="filters">
<input name="q" placeholder="Name"><input name="owner" placeholder="Owner"><input name="category" placeholder="Category"><input name="date" type="date"><button>Filter</button></form>
{% if docs %}<table><tr><th>Name</th><th>Owner</th><th>Category</th><th>Created</th><th></th></tr>{% for d in docs %}<tr><td>{{ d.original_name }}</td><td>{{ d.owner_name }}</td><td>{{ d.category }}</td><td>{{ d.created_at[:10] }}</td><td><a href="{{ url_for('document_detail',doc_id=d.id) }}">Open</a></td></tr>{% endfor %}</table>{% else %}<p>No matching documents you can access.</p>{% endif %}</section>{% endblock %}
